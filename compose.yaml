name: expediente

x-application-build: &application-build
  build:
    context: .
    target: production

x-application-environment: &application-environment
  APP_ENV: ${DOCKER_APP_ENV:-local}
  APP_DEBUG: ${DOCKER_APP_DEBUG:-true}
  APP_URL: ${DOCKER_APP_URL:-http://localhost:8081}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:-expediente}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-expediente}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-expediente}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database

services:
  app:
    <<: *application-build
    env_file: .env
    environment:
      <<: *application-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${DOCKER_APP_PORT:-8081}:80"
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *application-build
    env_file: .env
    environment: *application-environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *application-build
    env_file: .env
    environment: *application-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-expediente}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-expediente}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-expediente}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    ports:
      - "${DOCKER_DB_PORT:-3308}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "${DOCKER_MAILPIT_PORT:-8026}:8025"
    restart: unless-stopped

volumes:
  application-storage:
  database-data:
